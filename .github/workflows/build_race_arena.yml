name: Build Race Arena
on:
    workflow_dispatch:
concurrency:
    group: build-race-arena
    cancel-in-progress: false
jobs:
    race-arena:
        runs-on: ubuntu-latest
        timeout-minutes: 180
        permissions:
            contents: write
            actions: write
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - uses: arduino/setup-protoc@v3
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Prepare the simulator
              run: |
                  npm ci
                  go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
                  make sim/core/proto/api.pb.go ui/generated/proto/api.ts go-to-ts
            - name: Export the UI presets
              env:
                  RACE_ARENA_INPUT: ${{ runner.temp }}/race-arena-input.json
              run: npx vitest run ui/specs/race_arena_export.test.ts
            - name: Simulate and score every race
              run: |
                  node tools/race_arena/snapshot.mjs "$RUNNER_TEMP/race-arena-input.json"
                  go run -tags=with_db ./tools/race_arena/simulate -input "$RUNNER_TEMP/race-arena-input.json" -out "$RUNNER_TEMP/race-arena-out"
                  go run ./tools/race_arena "$RUNNER_TEMP/race-arena-out"
                  npx oxfmt ui/app/race_arena/results.json
            - name: Commit and deploy the rankings
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git add ui/app/race_arena/results.json
                  if git diff --cached --quiet; then exit 0; fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Refresh race arena results from upstream presets"
                  # A changed branch needs fresh simulations, so a rejected push fails this run.
                  git push origin HEAD:${{ github.ref_name }}
                  if [ "${{ github.ref_name }}" = master ]; then
                    gh workflow run deploy.yml --ref master
                  fi
