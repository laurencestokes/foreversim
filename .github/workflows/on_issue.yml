name: New issue webhook
on:
    issues:
        types: [opened]
jobs:
    send_webhook:
        if: github.repository == 'wowsims/forever'
        runs-on: ubuntu-latest
        steps:
            - name: Send webhook
              uses: Ilshidur/action-discord@master
              continue-on-error: true
              env:
                  DISCORD_WEBHOOK: ${{ secrets.WEBHOOK_URL }}
            - name: Exit 0
              run: exit 0
