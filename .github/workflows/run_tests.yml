name: Run Tests
on:
    # Test pull requests against any target branch.
    pull_request:
    # Reusable from other workflows (deploy, release). Their runs on master also
    # prime the Go/npm caches that pull request runs restore from.
    workflow_call:
        inputs:
            ref:
                description: 'Commit reference to test (defaults to the triggering ref)'
                required: false
                type: string
            proto_baseline:
                description: 'Commit that TestProtoVersioning diffs the protos against (defaults to remote master)'
                required: false
                type: string
# Runs called from master (deploy, release) have no pull request number; the
# run id keeps each in a group of its own so none is cancelled or queued.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true
jobs:
    build-ui:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}
                  # The full history, so the build can name each spec's last change (tools/vite/build_info.mts).
                  # git log over paths reads commits and trees only, so the file contents stay out of it.
                  fetch-depth: 0
                  filter: blob:none

            - name: Check commit blacklist 🔎
              run: |
                  if grep -q '"rollup/wasm-node"' package.json; then
                    echo "Error: 'rollup/wasm-node' found in package.json"
                    exit 1
                  fi

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x

            - name: Install Protoc
              uses: ./.github/actions/setup-protoc

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Check skills
              run: make skills-check

            - name: Test Locales 💬
              run: |
                  npm ci
                  npm run test:locales

            - name: Check formatting 🎯
              run: npm run fmt

            - name: Lint JS 🧹
              run: npm run lint:js

            - name: Lint CSS 🎨
              run: npm run lint:css

            - name: Generate TS sources 🧬
              run: make ui/generated/proto/api.ts go-to-ts

            # Vite reads .siml imports with `wowsimcli siml serve` (tools/vite/siml.mts); one build here spares
            # Storybook and the bundle a `go run` each.
            - name: Build wowsimcli for the SIML imports
              run: |
                  go build -o "$RUNNER_TEMP/wowsimcli" ./cmd/wowsimcli
                  echo "WOWSIMCLI=$RUNNER_TEMP/wowsimcli" >> "$GITHUB_ENV"

            - name: Type check 🧠
              run: npm run type-check

            - name: Test arena publication and snapshots
              run: node --test tools/build_arena/*.test.mjs tools/race_arena/snapshot.test.mjs

            # `check` builds the SIML extension afresh and fails when the committed build in .vscode/extensions
            # differs. The tests build the SIML server (`go build --tags=with_db ./cmd/wowsimcli`) as the extension
            # does, and run the panel and the sims against it. They run one file at a time: the files build the server
            # into one storage folder.
            - name: Test the SIML extension
              run: |
                  cd tools/vscode-apl
                  npm ci --no-audit --no-fund
                  npm run check
                  npm test

            # `check` regenerates the parser with the pinned CLI and fails when the committed one differs, runs the
            # corpus, parses every committed .siml file, compiles the Zed queries and parses the Zed snippets.
            - name: Test the SIML tree-sitter grammar
              run: |
                  cd tools/tree-sitter-siml
                  npm ci --no-audit --no-fund
                  npm run check

            - name: Build Storybook 📚
              run: npm run storybook:build

            - name: Build 🔧
              env:
                  # The release the page shows names the commit the preview comment names, not the merge commit.
                  BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
              run: |
                  make dist/forever/.dirstamp

    # Vitest splits the test files across the shards; each shard generates the TS sources it imports.
    test-ui:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x

            - name: Install Protoc
              uses: ./.github/actions/setup-protoc

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Generate TS sources 🧬
              run: make ui/generated/proto/api.ts go-to-ts

            # The tests import .siml presets, which Vite reads with `wowsimcli siml serve` (tools/vite/siml.mts).
            - name: Build wowsimcli for the SIML imports
              run: |
                  go build -o "$RUNNER_TEMP/wowsimcli" ./cmd/wowsimcli
                  echo "WOWSIMCLI=$RUNNER_TEMP/wowsimcli" >> "$GITHUB_ENV"

            - name: Unit tests (shard ${{ matrix.shard }}) 🧪
              run: npm run test:unit -- --shard=${{ matrix.shard }}/4

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                shard: [0, 1, 2, 3, 4, 5, 6, 7]
        steps:
            # Two commits deep, so a pull request's merge commit comes with its first parent, the base branch's
            # commit the name table check reads.
            - name: Checkout 🛎️
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: 2

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x

            - name: Install Protoc
              uses: ./.github/actions/setup-protoc

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            # TestProtoVersioning in sim/core shells out to `npx buf`, which needs node_modules.
            - name: Install npm dependencies
              run: npm ci

            - name: Generate proto and dist stubs
              run: make sim/core/proto/api.pb.go binary_dist/dist.go

            # TestTableKeepsItsEntries regenerates from the table the pull request holds, so it passes a table whose
            # names changed meaning. This fails when a name of the base branch's table means something else, or nothing,
            # unless the pull request adds the name's line to sim/siml/gen/repinned.txt, which simlnames -w -repin
            # writes. A pull request is checked out as its merge commit, whose first parent is the base.
            - name: Check the name table keeps its names
              if: github.event_name == 'pull_request' && matrix.shard == 0
              run: |
                  git rev-parse --verify --quiet HEAD^2 > /dev/null || { echo "HEAD is not the pull request's merge commit"; exit 1; }
                  go run ./sim/siml/cmd/simlnames -base HEAD^1

            # The buff manifest, the proto emitter and the buff generator's render and
            # TS tests need no game files database, and the database is not in the repo, so
            # the tests that do need it skip. One shard runs them.
            - name: Test generators and arena tools
              if: matrix.shard == 0
              run: go test ./tools/database/... ./tools/gen_buffs_proto/... ./tools/race_arena/... ./tools/build_arena/...

            # The tools that read and sim SIML files, wowsimcli's check of the files under ui/specs among them, and
            # sim/siml built without the with_db tag, which holds no name table. The test that the table keeps its
            # entries runs with ./sim/... below.
            - name: Test the SIML tools
              if: matrix.shard == 0
              run: |
                  go test --tags=with_db ./cmd/wowsimcli/...
                  go test ./sim/siml/...

            - name: Test (shard ${{ matrix.shard }})
              env:
                  GOARCH: amd64
                  # On a master push, master already contains the change under test, so diffing the
                  # protos against master finds nothing and a legitimate version bump fails. The deploy
                  # workflow passes the pre-push commit instead; pull requests keep the master default.
                  PROTO_BASELINE_REF: ${{ inputs.proto_baseline }}
              run: |
                  go list ./sim/... | awk 'NR % 8 == ${{ matrix.shard }}' | xargs -r go test --tags=with_db
